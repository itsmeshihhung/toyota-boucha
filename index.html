<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOYOTA 正式網路報價產生器</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#20252b;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px 14px 45px}header{background:#a91520;color:white;padding:22px;border-radius:18px;margin-bottom:15px}h1{font-size:23px;margin:0 0 6px}header p{margin:0;opacity:.9;font-size:13px}.panel{background:white;border-radius:15px;padding:18px;margin:13px 0;box-shadow:0 2px 12px #1a22300c}h2{font-size:17px;margin:0 0 15px;border-left:4px solid #b91e29;padding-left:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}input,select,textarea{font:inherit;width:100%;border:1px solid #d7dce2;border-radius:9px;padding:11px;background:white;color:#20252b}textarea{min-height:90px}.field{margin-bottom:12px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;align-items:center;gap:7px;font-size:14px}.check input{width:auto}.total{background:#fff4f4;color:#a91520;padding:15px;border-radius:12px;font-size:23px;font-weight:800;text-align:center}.small{font-size:12px;color:#65707c;line-height:1.6}.actions{display:flex;gap:9px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:13px 17px;font-weight:700;font-size:15px;cursor:pointer}button.primary{background:#ae1723;color:white;flex:1}button.secondary{background:#e9edf1;color:#20252b}.output{white-space:pre-wrap;background:#fafbfc;border:1px solid #e0e5eb;border-radius:12px;padding:16px;font-size:14px;line-height:1.8;overflow-wrap:anywhere}.notice{font-size:12px;color:#67717d;margin-top:10px}@media(max-width:480px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:15px}}</style></head><body><div class="wrap"><header><h1>TOYOTA 正式網路報價產生器</h1><p>楊梅營業所｜快速填寫・即時試算・一鍵複製</p></header><div class="panel"><h2>① 車輛與優惠</h2><div class="grid"><div class="field"><label>車型與等級</label><input id="model" placeholder="例：COROLLA CROSS HYBRID 豪華"></div><div class="field"><label>年式</label><input id="year" placeholder="例：2027年式"></div><div class="field"><label>車色</label><input id="color" placeholder="例：白色／待確認"></div><div class="field"><label>報價日期</label><input id="date" type="date"></div><div class="field"><label>車輛定價（元）</label><input id="price" type="number" min="0" value="879000"></div><div class="field"><label>折扣金額（元）</label><input id="discount" type="number" min="0" value="110000"></div><div class="field"><label>購車方式</label><select id="payment"><option>現金價</option><option>貸款方案（細節另議）</option></select></div><div class="field"><label>優惠適用期限</label><input id="expiry" type="date"></div></div><div class="total" id="total">優惠成交價：769,000 元</div></div><div class="panel"><h2>② 保險、領牌與補助</h2><div class="field"><label>保險條件</label><select id="insurance"><option>第一年需投保乙式車體險</option><option>第一年需投保甲式車體險</option><option>依雙方確認之投保方案</option></select></div><div class="grid"><div class="field"><label>保險預估最低（元）</label><input id="insmin" type="number" value="35000"></div><div class="field"><label>保險預估最高（元）</label><input id="insmax" type="number" value="45000"></div></div><div class="field"><label>領牌費用說明</label><input id="plate" value="領牌規費及代辦費依實際報價；牌照稅、燃料使用費依車型與領牌日期另計"></div><div class="field"><label>補助說明</label><input id="subsidy" value="政府補助、舊換新等優惠另計，依實際資格為準"></div></div><div class="panel"><h2>③ 贈送配件與交期</h2><div class="checks" id="giftbox"><label class="check"><input type="checkbox" value="避光墊" checked>避光墊</label><label class="check"><input type="checkbox" value="防水腳踏墊" checked>防水腳踏墊</label><label class="check"><input type="checkbox" value="防水行李廂托盤" checked>防水行李廂托盤</label><label class="check"><input type="checkbox" value="ETC設備" checked>ETC設備</label></div><div class="field" style="margin-top:13px"><label>其他贈品（以頓號分隔）</label><input id="extraGifts" placeholder="例：鑰匙皮套、車用收納袋"></div><div class="field"><label>選購配件說明</label><input id="accessories" value="影音、隔熱紙、行車紀錄器及其他配件可依需求報價，以原廠配件為優先"></div><div class="field"><label>交期</label><select id="delivery"><option>待確認</option><option>現車（實際庫存待確認）</option><option>依配車狀況另行通知</option><option>自訂交期</option></select></div><div class="field"><label>自訂交期（選擇自訂時使用）</label><input id="customDelivery" placeholder="例：預估12月中旬，依實際配車為準"></div></div><div class="panel"><h2>④ 業務聯絡資訊</h2><div class="grid"><div class="field"><label>服務人員</label><input id="sales" value="郭師宏"></div><div class="field"><label>聯絡電話</label><input id="phone" value="0975-801-137"></div></div><div class="field"><label>LINE聯絡資訊（可留空）</label><input id="line" placeholder="例：LINE ID 或連結"></div><div class="field"><label>其他備註（可留空）</label><textarea id="notes" placeholder="例：指定配件、特殊方案說明"></textarea></div></div><div class="panel"><h2>⑤ 正式報價文字</h2><div class="actions"><button class="primary" id="copy">複製完整報價</button><button class="secondary" id="reset">恢復範例</button></div><p id="status" class="small" aria-live="polite"></p><div class="output" id="output"></div><p class="notice">提醒：本工具僅供產生文字，不會自動驗證車價、活動、稅費或配車。請於傳送前核對最新條件。資料僅在本頁面使用，不會傳送到伺服器。</p></div></div><script>const $=id=>document.getElementById(id);const val=id=>$(id).value.trim();const money=n=>Number(n||0).toLocaleString('zh-TW');const ids=['model','year','color','date','price','discount','payment','expiry','insurance','insmin','insmax','plate','subsidy','extraGifts','accessories','delivery','customDelivery','sales','phone','line','notes'];function make(){let p=Number(val('price')),d=Number(val('discount'));$('total').textContent='優惠成交價：'+money(p-d)+' 元';let gifts=[...document.querySelectorAll('#giftbox input:checked')].map(e=>e.value);if(val('extraGifts'))gifts.push(...val('extraGifts').split(/[、,，]/).map(s=>s.trim()).filter(Boolean));let delivery=val('delivery')==='自訂交期'?(val('customDelivery')||'待確認'):val('delivery');let lines=['🚗 TOYOTA 專屬購車報價','',`您好！我是 TOYOTA 楊梅營業所 ${val('sales')||'服務人員'}，以下提供本次購車方案。`,'','📋 一、車輛價格',`車型：${val('model')||'待確認'}`,`年式：${val('year')||'待確認'}`,`車色：${val('color')||'待確認'}`,`車輛定價：${money(p)}元`,`購車折扣：${money(d)}元`,`💰 優惠成交價：${money(p-d)}元`,'','📋 二、購車條件',`▪️ ${val('payment')}`,`▪️ ${val('insurance')}`,`▪️ ${val('subsidy')}`,'','📋 三、保險費用',`預估約 ${money(val('insmin'))}～${money(val('insmax'))} 元，實際依車主條件、投保紀錄及保障內容試算。`,'','📋 四、領牌費用',val('plate'),'','🎁 五、贈送配件',...(gifts.length?gifts.map(x=>'✅ '+x):['依雙方確認內容為準']),'','🔧 六、其他配件',val('accessories'),'','🚘 七、交車時間',delivery,'','📌 八、報價資訊',`報價日期：${val('date')||'待填寫'}`,`優惠適用期限：${val('expiry')||'依當期活動及確認內容為準'}`,'實際購車條件依當期活動及雙方確認內容為準。'];if(val('notes'))lines.push('','其他備註：'+val('notes'));lines.push('','━━━━━━━━━━━━','🏢 TOYOTA 楊梅營業所',`👨‍💼 ${val('sales')||'服務人員'}`,`☎️ ${val('phone')||'待提供'}`);if(val('line'))lines.push(`💬 LINE：${val('line')}`);lines.push('','感謝您給我報價服務的機會！如需確認車色、配備或交期，歡迎隨時與我聯絡。');$('output').textContent=lines.join('\n')}function today(){let d=new Date(),local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,10)}$('date').value=today();document.querySelectorAll('input,select,textarea').forEach(e=>{e.addEventListener('input',make);e.addEventListener('change',make)});$('copy').addEventListener('click',async()=>{let t=$('output').textContent;try{await navigator.clipboard.writeText(t);$('status').textContent='✓ 已複製，可直接貼到 LINE、8891 或 Messenger。'}catch(e){let r=document.createRange();r.selectNodeContents($('output'));let s=window.getSelection();s.removeAllRanges();s.addRange(r);$('status').textContent='已選取文字，請長按複製。'}});$('reset').addEventListener('click',()=>{if(confirm('確定恢復範例資料？'))location.reload()});make();</script></body></html>
